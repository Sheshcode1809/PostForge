openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: PostForge API specification with authentication and synced draft history
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: LinkedIn post generation
  - name: auth
    description: User authentication and account management
  - name: drafts
    description: User-synced draft storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /posts/generate:
    post:
      operationId: generatePost
      tags: [posts]
      summary: Generate a LinkedIn post from a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePostBody"
      responses:
        "200":
          description: Generated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePostResponse"

  /posts/rewrite:
    post:
      operationId: rewritePost
      tags: [posts]
      summary: Rewrite a section or tone of an existing LinkedIn post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewritePostBody"
      responses:
        "200":
          description: Rewritten post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewritePostResponse"

  /auth/signup:
    post:
      operationId: authSignup
      tags: [auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupBody"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Authenticate an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Terminate session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleSuccessResponse"

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get currently authenticated user
      responses:
        "200":
          description: Current user profile or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [auth]
      summary: Request password reset instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset instructions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"

  /auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleSuccessResponse"

  /drafts:
    get:
      operationId: getSyncedDrafts
      tags: [drafts]
      summary: List authenticated user's drafts
      responses:
        "200":
          description: List of drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncedDraft"
    post:
      operationId: createSyncedDraft
      tags: [drafts]
      summary: Save a draft to user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftBody"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncedDraft"

  /drafts/{id}:
    put:
      operationId: updateSyncedDraft
      tags: [drafts]
      summary: Update a draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftBody"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncedDraft"
    delete:
      operationId: deleteSyncedDraft
      tags: [drafts]
      summary: Delete a draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Draft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleSuccessResponse"

  /drafts/import:
    post:
      operationId: importLocalDrafts
      tags: [drafts]
      summary: Explicitly import local drafts into user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportDraftsBody"
      responses:
        "200":
          description: Drafts imported
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncedDraft"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SimpleSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        createdAt:
          type: number
      required:
        - id
        - email

    AuthUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user

    AuthMeResponse:
      type: object
      properties:
        user:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/User"
      required:
        - user

    SignupBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
      required:
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    ForgotPasswordBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ForgotPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        resetToken:
          type: string
      required:
        - success
        - message

    ResetPasswordBody:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - token
        - newPassword

    SyncedDraft:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        topic:
          type: string
        post:
          type: string
        hashtags:
          type: array
          items:
            type: string
        tone:
          type: string
        length:
          type: string
        format:
          type: string
        audience:
          type: string
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - userId
        - title
        - topic
        - post
        - hashtags
        - createdAt
        - updatedAt

    CreateDraftBody:
      type: object
      properties:
        title:
          type: string
        topic:
          type: string
        post:
          type: string
        hashtags:
          type: array
          items:
            type: string
        tone:
          type: string
        length:
          type: string
        format:
          type: string
        audience:
          type: string
      required:
        - topic
        - post

    UpdateDraftBody:
      type: object
      properties:
        title:
          type: string
        topic:
          type: string
        post:
          type: string
        hashtags:
          type: array
          items:
            type: string
        tone:
          type: string
        length:
          type: string
        format:
          type: string
        audience:
          type: string

    ImportDraftsBody:
      type: object
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/CreateDraftBody"
      required:
        - drafts

    PostVariation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        post:
          type: string
        hashtags:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - post

    GeneratePostBody:
      type: object
      properties:
        topic:
          type: string
          minLength: 2
          maxLength: 500
        tone:
          type: string
          enum: [professional, inspirational, storytelling, humorous, bold, educational]
        length:
          type: string
          enum: [short, medium, long]
        format:
          type: string
          enum: [lesson_learned, practical_list, opinion, personal_story, announcement, question_led]
        audience:
          type: string
          maxLength: 200
        includeHashtags:
          type: boolean
        includeEmojis:
          type: boolean
        generateVariations:
          type: boolean
        voiceProfile:
          type: string
      required:
        - topic
        - tone
        - length

    GeneratePostResponse:
      type: object
      properties:
        post:
          type: string
        hashtags:
          type: array
          items:
            type: string
        variations:
          type: array
          items:
            $ref: "#/components/schemas/PostVariation"
      required:
        - post
        - hashtags

    RewritePostBody:
      type: object
      properties:
        post:
          type: string
        action:
          type: string
          enum: [strengthen_hook, make_clearer, make_shorter, make_warmer, stronger_closing]
        tone:
          type: string
      required:
        - post
        - action

    RewritePostResponse:
      type: object
      properties:
        post:
          type: string
        action:
          type: string
        previousPost:
          type: string
      required:
        - post
        - action
        - previousPost
